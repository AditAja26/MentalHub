<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${user.name + ' - User Detail'}">User Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F3F7FA; }
        .glass-card { background: white; border: 1px solid rgba(226, 232, 240, 0.8); }
    </style>
</head>
<body class="min-h-screen">
    <header class="w-full bg-white border-b border-gray-100 py-4 px-6 md:px-12 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-[#4A90E2] flex items-center justify-center rounded-lg shadow-sm">
                <span class="text-white font-bold text-lg">M</span>
            </div>
            <span class="text-gray-900 font-bold text-lg tracking-tight">MentalHub</span>
        </div>
        <nav class="hidden md:flex items-center gap-8">
            <a th:href="@{/advisor/home}" class="text-gray-500 hover:text-gray-900 font-medium">Home</a>
            <a th:href="@{/advisor/monitor}" class="text-gray-500 hover:text-gray-900 font-medium">Monitor</a>
            <a th:href="@{/admin/users}" class="text-[#4A90E2] font-semibold border-b-2 border-[#4A90E2] pb-1">Manage Users</a>
        </nav>
        <div class="w-8 h-8 rounded-full bg-gray-200"></div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-12">
        <div class="glass-card rounded-3xl p-8 shadow-sm">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
                <div>
                    <h1 class="text-4xl font-extrabold text-gray-900" th:text="${user.name}">Bambang</h1>
                    <p class="text-gray-500 mt-1" th:text="${user.email}">bambang@yahoo.com</p>
                </div>
                <div class="flex gap-3">
                    <a th:href="@{/admin/users}" class="px-6 py-2.5 rounded-xl border border-gray-200 font-semibold text-gray-600 hover:bg-gray-50 transition-all">Back</a>
                    <a th:href="@{/admin/users/{id}/remove(id=${user.id})}" 
                       onclick="return confirm('Remove this user?')"
                       class="px-6 py-2.5 rounded-xl bg-red-50 text-red-600 font-semibold hover:bg-red-100 transition-all">Remove User</a>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-4">
                    <h3 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-blue-500"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        Goals Listed
                    </h3>
                    <div class="space-y-3">
                        <div th:if="${#lists.isEmpty(user.goals)}" class="p-6 border-2 border-dashed border-gray-100 rounded-2xl text-center text-gray-400 italic">
                            No goals assigned yet.
                        </div>
                        <div th:each="goal : ${user.goals}" class="flex items-center justify-between p-4 rounded-2xl bg-gray-50 border border-gray-100">
                            <span class="text-gray-700 font-medium" th:text="${goal.description}">Goal Description</span>
                            <span th:class="${goal.completed ? 'text-green-600 bg-green-100' : 'text-orange-600 bg-orange-100'} + ' text-[10px] font-bold px-2 py-1 rounded-md uppercase'"
                                  th:text="${goal.completed ? 'Done' : 'Pending'}">Status</span>
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    <h3 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-blue-500"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                        User Information
                    </h3>
                    <div class="bg-blue-50/50 rounded-2xl p-6 space-y-4">
                        <div class="flex justify-between border-b border-blue-100 pb-3">
                            <span class="text-blue-600/70 text-sm font-medium">Age</span>
                            <span class="text-gray-900 font-bold" th:text="${user.age + ' Years'}">21 Years</span>
                        </div>
                        <div class="flex justify-between border-b border-blue-100 pb-3">
                            <span class="text-blue-600/70 text-sm font-medium">Phone</span>
                            <span class="text-gray-900 font-bold" th:text="${user.phone}">082337729130</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-blue-600/70 text-sm font-medium">Role</span>
                            <span class="text-gray-900 font-bold capitalize" th:text="${user.role}">Student</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
