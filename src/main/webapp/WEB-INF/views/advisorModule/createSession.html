<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Session - MentalHub</title>
    <link th:href="@{/resources/css/nav-bar.css}" rel="stylesheet" type="text/css"/>
    <style>
        .container { max-width: 600px; margin: 40px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); font-family: 'Segoe UI', sans-serif; }
        .form-title { font-size: 24px; font-weight: 700; color: #333; margin-bottom: 25px; text-align: center; }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; font-size: 14px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; transition: 0.3s; }
        .form-control:focus { outline: none; border-color: #6C63FF; box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.1); }
        
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }

        .btn-submit { width: 100%; background-color: #6C63FF; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background-color: #5b54d6; }
        
        .btn-cancel { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
        .btn-cancel:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div th:replace="~{_layout :: main-header}"></div>

    <div class="container">
        <h2 class="form-title">Create New Session</h2>
        
        <form th:action="@{/advisor/sessions/save}" th:object="${counselingSession}" method="post">
            
            <div class="form-group">
                <label class="form-label">Title</label>
                <input type="text" th:field="*{title}" class="form-control" placeholder="e.g. Anxiety Support Group" required>
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="4" placeholder="What will be discussed?" required></textarea>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label class="form-label">Date</label>
                    <input type="date" th:field="*{date}" class="form-control" required>
                </div>
                <div class="col form-group">
                    <label class="form-label">Time</label>
                    <input type="time" th:field="*{time}" class="form-control" required>
                </div>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label class="form-label">Max Attendees</label>
                    <input type="number" th:field="*{maxCapacity}" class="form-control" value="10" min="1" required>
                </div>
                <div class="col form-group">
                    <label class="form-label">Location / Link</label>
                    <input type="text" th:field="*{meetingLink}" class="form-control" placeholder="Room Number or Zoom Link" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Create Session</button>
            <a th:href="@{/advisor/sessions}" class="btn-cancel">Cancel</a>
        </form>
    </div>
</body>
</html>
