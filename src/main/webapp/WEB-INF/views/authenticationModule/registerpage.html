<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MentalHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #F0F4F8 0%, #E8EEF5 50%, #E5E0F0 100%);
            min-height: 100vh;
        }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        .logo-container { display: flex; align-items: center; gap: 10px; }
        .logo-img { height: 60px; width: auto; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .sign-in-link {
            background-color: #4A90E2;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .sign-in-link:hover { background-color: #357ABD; }
        .main-container { display: flex; max-width: 1400px; margin: 0 auto; padding: 40px 50px; gap: 60px; align-items: center; }
        .left-section { flex: 1.2; }
        .main-heading { font-size: 48px; font-weight: 700; color: #4A90E2; line-height: 1.2; margin-bottom: 30px; }
        .illustration-img { height: 280px; width: auto; }
        .stats-bar { background: white; border-radius: 20px; padding: 25px 50px; display: flex; justify-content: space-around; box-shadow: 0 10px 40px rgba(0,0,0,0.08); margin-top: 30px; }
        .stat-number { font-size: 28px; font-weight: 700; color: #4A90E2; }
        .stat-label { font-size: 14px; color: #666; }
        .right-section { flex: 0.8; max-width: 420px; }
        .welcome-text { font-size: 32px; font-weight: 700; color: #333; margin-bottom: 30px; text-align: center; }
        
        /* NEW: Error Message Styling */
        .error-box {
            background-color: #ffeeee;
            color: #d9534f;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ebccd1;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            font-weight: 500;
        }

        .form-group { margin-bottom: 15px; }
        .form-input, .form-select {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            background-color: rgba(200, 210, 220, 0.4);
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }
        .form-input:focus { box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2); }
        .password-wrapper { position: relative; }
        .password-toggle { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #666; }
        .register-btn { width: 100%; padding: 16px; background-color: #4A90E2; color: white; border: none; border-radius: 30px; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 15px; }
        .login-prompt { text-align: center; margin-top: 20px; color: #666; font-size: 14px; }
        .login-prompt a { color: #4A90E2; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <img th:src="@{/resources/images/logo.png}" alt="MentalHub Logo" class="logo-img">
        </div>
        <div class="header-right">
            <a th:href="@{/login}" class="sign-in-link">Sign in</a>
        </div>
    </header>

    <main class="main-container">
        <section class="left-section">
            <h1 class="main-heading">Your Mental Health<br>Journey Starts Here</h1>
            <div class="illustration-container">
                <img th:src="@{/resources/images/Sitting.png}" alt="Person sitting" class="illustration-img">
            </div>
            <div class="stats-bar">
                <div class="stat-item"><div class="stat-number">24/7</div><div class="stat-label">Support</div></div>
                <div class="stat-item"><div class="stat-number">50+</div><div class="stat-label">Modules</div></div>
                <div class="stat-item"><div class="stat-number">100%</div><div class="stat-label">Secure</div></div>
            </div>
        </section>

        <section class="right-section">
            <div class="register-card" id="register-form">
                <h2 class="welcome-text">Create Account</h2>
                
                <div th:if="${error}" class="error-box">
                    <span th:text="${error}"></span>
                </div>
                
                <form th:action="@{/register}" method="post">
                    <div class="form-group">
                        <input type="text" name="name" class="form-input" placeholder="Full Name" th:value="${typedName}" required>
                    </div>

                    <div class="form-group">
                        <input type="number" name="age" class="form-input" placeholder="Age" min="13" max="100" th:value="${typedAge}" required>
                    </div>

                    <div class="form-group">
                        <input type="tel" name="phone" class="form-input" placeholder="Phone Number" th:value="${typedPhone}" required>
                    </div>

                    <div class="form-group">
                        <input type="email" name="email" class="form-input" placeholder="Email" th:value="${typedEmail}" required>
                    </div>
                    
                    <div class="form-group">
                        <div class="password-wrapper">
                            <input type="password" name="password" id="password" class="form-input" placeholder="Password" required>
                            <button type="button" class="password-toggle" onclick="togglePassword('password')">👁</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="password-wrapper">
                            <input type="password" name="confirmPassword" id="confirmPassword" class="form-input" placeholder="Confirm Password" required>
                            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">👁</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <select name="role" class="form-select" required>
                            <option value="" disabled selected>Select Role</option>
                            <option value="student">Student</option>
                            <option value="advisor">Advisor</option>
                        </select>
                    </div>

                    <button type="submit" class="register-btn">Register</button>
                </form>

                <div class="login-prompt">
                    Already have an account? <a th:href="@{/login}">Sign in</a>
                </div>
            </div>
        </section>
    </main>

    <script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            const btn = input.nextElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁';
            }
        }
    </script>
</body>
</html>
