<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Mood Assessment Quiz Modal Fragment -->
<div th:fragment="mood-modal">
    <!-- Modal Overlay -->
    <div id="moodModal" class="mood-modal-overlay" style="display: none;">
        <div class="mood-modal-content">
            <div class="mood-modal-header">
                <h2>Mental Wellness Check-In</h2>
                <p class="mood-subtitle">Please answer these brief questions to help us understand your well-being</p>
            </div>
            
            <form th:action="@{/mood/log}" method="post" id="moodForm" onsubmit="return validateQuiz()">
                <div class="quiz-container">
                    
                    <!-- Question 1: Overall Feeling -->
                    <div class="quiz-question">
                        <label class="question-label">
                            <span class="question-number">1.</span> 
                            How have you been feeling overall this week?
                        </label>
                        <div class="rating-options">
                            <label class="rating-option">
                                <input type="radio" name="q1" value="1" required>
                                <span class="rating-label">Very Poor</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q1" value="2" required>
                                <span class="rating-label">Poor</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q1" value="3" required>
                                <span class="rating-label">Okay</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q1" value="4" required>
                                <span class="rating-label">Good</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q1" value="5" required>
                                <span class="rating-label">Excellent</span>
                            </label>
                        </div>
                    </div>

                    <!-- Question 2: Sleep Quality -->
                    <div class="quiz-question">
                        <label class="question-label">
                            <span class="question-number">2.</span> 
                            How well have you been sleeping?
                        </label>
                        <div class="rating-options">
                            <label class="rating-option">
                                <input type="radio" name="q2" value="1" required>
                                <span class="rating-label">Very Poorly</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q2" value="2" required>
                                <span class="rating-label">Poorly</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q2" value="3" required>
                                <span class="rating-label">Fair</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q2" value="4" required>
                                <span class="rating-label">Well</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q2" value="5" required>
                                <span class="rating-label">Very Well</span>
                            </label>
                        </div>
                    </div>

                    <!-- Question 3: Stress Level -->
                    <div class="quiz-question">
                        <label class="question-label">
                            <span class="question-number">3.</span> 
                            Do you feel overwhelmed by stress?
                        </label>
                        <div class="rating-options">
                            <label class="rating-option">
                                <input type="radio" name="q3" value="5" required>
                                <span class="rating-label">Not at All</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q3" value="4" required>
                                <span class="rating-label">Slightly</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q3" value="3" required>
                                <span class="rating-label">Moderately</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q3" value="2" required>
                                <span class="rating-label">Very Much</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q3" value="1" required>
                                <span class="rating-label">Extremely</span>
                            </label>
                        </div>
                    </div>

                    <!-- Question 4: Focus Ability -->
                    <div class="quiz-question">
                        <label class="question-label">
                            <span class="question-number">4.</span> 
                            Are you able to focus on your tasks?
                        </label>
                        <div class="rating-options">
                            <label class="rating-option">
                                <input type="radio" name="q4" value="1" required>
                                <span class="rating-label">Never</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q4" value="2" required>
                                <span class="rating-label">Rarely</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q4" value="3" required>
                                <span class="rating-label">Sometimes</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q4" value="4" required>
                                <span class="rating-label">Often</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q4" value="5" required>
                                <span class="rating-label">Always</span>
                            </label>
                        </div>
                    </div>

                    <!-- Question 5: Social Connection -->
                    <div class="quiz-question">
                        <label class="question-label">
                            <span class="question-number">5.</span> 
                            How connected do you feel to friends or family?
                        </label>
                        <div class="rating-options">
                            <label class="rating-option">
                                <input type="radio" name="q5" value="1" required>
                                <span class="rating-label">Very Isolated</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q5" value="2" required>
                                <span class="rating-label">Isolated</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q5" value="3" required>
                                <span class="rating-label">Neutral</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q5" value="4" required>
                                <span class="rating-label">Connected</span>
                            </label>
                            <label class="rating-option">
                                <input type="radio" name="q5" value="5" required>
                                <span class="rating-label">Very Connected</span>
                            </label>
                        </div>
                    </div>

                </div>

                <div class="mood-modal-footer">
                    <button type="submit" class="btn-submit">Submit Assessment</button>
                    <button type="button" class="btn-skip" onclick="skipMoodLog()">Skip for Now</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Styles for Mood Quiz Modal -->
    <style>
        /* Modal Overlay */
        .mood-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Modal Content Box */
        .mood-modal-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 650px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Header */
        .mood-modal-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .mood-modal-header h2 {
            font-size: 26px;
            color: #333;
            margin: 0 0 10px 0;
            font-weight: 600;
        }

        .mood-subtitle {
            font-size: 15px;
            color: #666;
            margin: 0;
            line-height: 1.5;
        }

        /* Quiz Container */
        .quiz-container {
            margin-bottom: 30px;
        }

        .quiz-question {
            margin-bottom: 28px;
            padding-bottom: 28px;
            border-bottom: 1px solid #e9ecef;
        }

        .quiz-question:last-child {
            border-bottom: none;
        }

        .question-label {
            display: block;
            font-size: 16px;
            font-weight: 500;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .question-number {
            display: inline-block;
            background: #7b68ee;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-size: 14px;
            margin-right: 8px;
        }

        /* Rating Options */
        .rating-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .rating-option {
            flex: 1;
            min-width: 90px;
            cursor: pointer;
        }

        .rating-option input[type="radio"] {
            display: none;
        }

        .rating-label {
            display: block;
            padding: 12px 8px;
            background: #f8f9fa;
            border: 2px solid transparent;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: #666;
            transition: all 0.2s ease;
        }

        .rating-option:hover .rating-label {
            background: #e9ecef;
            transform: translateY(-2px);
        }

        .rating-option input[type="radio"]:checked + .rating-label {
            background: #f0ebff;
            border-color: #7b68ee;
            color: #7b68ee;
            box-shadow: 0 3px 10px rgba(123, 104, 238, 0.2);
        }

        /* Footer Buttons */
        .mood-modal-footer {
            display: flex;
            gap: 15px;
            justify-content: center;
            padding-top: 10px;
        }

        .btn-submit,
        .btn-skip {
            padding: 14px 32px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: #7b68ee;
            color: white;
        }

        .btn-submit:hover {
            background: #6952d6;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(123, 104, 238, 0.3);
        }

        .btn-skip {
            background: #e9ecef;
            color: #666;
        }

        .btn-skip:hover {
            background: #dee2e6;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .mood-modal-content {
                padding: 25px 20px;
                max-height: 90vh;
            }

            .mood-modal-header h2 {
                font-size: 22px;
            }

            .rating-options {
                flex-direction: column;
            }

            .rating-option {
                min-width: 100%;
            }

            .btn-submit, .btn-skip {
                padding: 12px 24px;
                font-size: 15px;
            }
        }

        /* Scrollbar Styling */
        .mood-modal-content::-webkit-scrollbar {
            width: 8px;
        }

        .mood-modal-content::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .mood-modal-content::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        .mood-modal-content::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>

    <!-- JavaScript for Modal Control -->
    <script th:inline="javascript">
        // Check if mood should be shown on page load
        // Note: This checks PER SESSION, not per day - so it appears on every new login
        window.addEventListener('DOMContentLoaded', function() {
            /*<![CDATA[*/
            var moodLoggedToday = /*[[${session.moodLoggedToday}]]*/ false;
            var moodSkippedToday = /*[[${session.moodSkippedToday}]]*/ false;
            /*]]>*/
            
            console.log("Mood Check (Per Login Session) - Logged:", moodLoggedToday, "Skipped:", moodSkippedToday);
            
            // Show modal if mood hasn't been logged and hasn't been skipped in this LOGIN SESSION
            // This will show the modal on every new login, even if user logged in earlier today
            if (!moodLoggedToday && !moodSkippedToday) {
                setTimeout(function() {
                    var modal = document.getElementById('moodModal');
                    if (modal) {
                        modal.style.display = 'flex';
                        console.log("Mood quiz modal displayed for this login session");
                    }
                }, 800); // Delay for better UX
            } else {
                console.log("Mood quiz already completed or skipped for this session");
            }
        });

        // Validate quiz before submission
        function validateQuiz() {
            var questions = ['q1', 'q2', 'q3', 'q4', 'q5'];
            for (var i = 0; i < questions.length; i++) {
                var answered = document.querySelector('input[name="' + questions[i] + '"]:checked');
                if (!answered) {
                    alert('Please answer all questions before submitting.');
                    return false;
                }
            }
            return true;
        }

        // Skip function with form submission
        function skipMoodLog() {
            // Create and submit skip form
            var form = document.createElement('form');
            form.method = 'POST';
            form.action = /*[[@{/mood/skip}]]*/ '/mood/skip';
            document.body.appendChild(form);
            form.submit();
        }

        // Prevent closing modal by clicking outside (user must choose or skip)
        document.addEventListener('click', function(event) {
            var modal = document.getElementById('moodModal');
            if (event.target === modal) {
                // Optionally allow closing by clicking outside:
                // skipMoodLog();
            }
        });
    </script>
</div>

</body>
</html>
