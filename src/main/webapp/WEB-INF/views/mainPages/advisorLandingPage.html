<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Advisor Dashboard - MentalHub</title>
    <link th:href="@{/resources/css/nav-bar.css}" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .welcome-section {
            margin-bottom: 30px;
        }

        .welcome-text {
            font-size: 32px;
            color: #333;
            font-weight: 500;
        }

        .welcome-name {
            color: #4A90E2;
            font-style: italic;
            text-decoration: none;
            transition: all 0.3s;
        }

        .welcome-name:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            margin-top: 8px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-top: 30px;
        }

        /* Unified Card Design */
        .feature-card {
            background-color: #D8D4E0;
            border-radius: 16px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            min-height: 140px;
            border: 1px solid transparent;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            background-color: #CDC9D5;
            border-color: #bbb;
        }

        .card-image {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            flex-shrink: 0;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #444;
            line-height: 1.2;
            margin-bottom: 5px;
        }
        
        .card-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div th:replace="~{_layout :: main-header}"></div>

    <div class="container">
        <div class="welcome-section">
            <h1 class="welcome-text">
                Welcome Back, <a th:href="@{/advisor/profile}" class="welcome-name" th:text="${advisorName}">Advisor</a>
            </h1>
            <p class="subtitle">Select a module to manage student wellness.</p>
        </div>

        <div class="cards-grid">
            <a th:href="@{/advisor/monitor}" class="feature-card">
                <div class="card-image">📊</div>
                <div class="card-content">
                    <h2 class="card-title">Monitor Dashboard</h2>
                </div>
            </a>

            <a th:href="@{/advisor/appointment}" class="feature-card">
                <div class="card-image">📅</div>
                <div class="card-content">
                    <h2 class="card-title">Manage Appointments</h2>
                </div>
            </a>

            <a th:href="@{/advisor/sessions}" class="feature-card">
                <div class="card-image">👥</div>
                <div class="card-content">
                    <h2 class="card-title">Group Sessions</h2>
                </div>
            </a>

            <a th:href="@{/peer/posts}" class="feature-card">
                <div class="card-image">💬</div>
                <div class="card-content">
                    <h2 class="card-title">Peer Forum</h2>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
