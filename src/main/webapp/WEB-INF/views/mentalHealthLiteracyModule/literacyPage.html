<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mental Health Literacy | MentalHub</title>
    <link rel="stylesheet" th:href="@{/resources/css/nav-bar.css}"/>
    <style>
        /* Base Styling */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; color: #343a40; }
        .literacy-container { display: flex; max-width: 1200px; margin: 40px auto; padding: 0 20px; gap: 30px; flex-wrap: wrap; }
        
        /* CARD CONTAINER STYLING */
        .link-section, .quiz-section { 
            flex: 1; 
            min-width: 300px; 
            background-color: #ffffff; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05); 
            padding: 25px; 
            
            /* FIXED HEIGHT & LAYOUT */
            height: 500px; /* Adjust this to change total card size */
            display: flex;
            flex-direction: column; /* Stack Header then Content */
        }

        /* HEADER STYLING (Stays Fixed) */
        .link-section h2, .quiz-section h2 { 
            background-color: #7b68ee; 
            color: white; 
            padding: 15px 20px; 
            /* Negative margins pull it to the edge */
            margin: -25px -25px 20px -25px; 
            border-top-left-radius: 8px; 
            border-top-right-radius: 8px; 
            font-size: 1.5rem; 
            text-align: center; 
            text-transform: uppercase; 
            
            /* Ensure it doesn't shrink */
            flex-shrink: 0; 
        }

        /* SCROLLABLE CONTENT AREA */
        .scrollable-content {
            flex: 1;          /* Fills remaining height */
            overflow-y: auto; /* Scrollbar appears here */
            padding-right: 5px; /* Space for scrollbar */
        }

        /* Rest of your CSS (Articles, Quiz, Feedback, etc.) */
        .article-card { border: 1px solid #dee2e6; border-radius: 6px; padding: 15px; margin-bottom: 15px; transition: box-shadow 0.2s; }
        .article-card:hover { box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); }
        .quiz-question { margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .quiz-question p { font-weight: bold; margin-bottom: 10px; }
        .radio-option { margin-bottom: 8px; padding: 10px; border-radius: 6px; transition: background-color 0.2s; cursor: pointer; display: flex; align-items: center; }
        .radio-option:hover { background-color: #f1f3f5; }
        .radio-option input { margin-right: 10px; cursor: pointer; }
        .radio-option label { cursor: pointer; width: 100%; display: inline-block; margin: 0; }
        .correct-choice { background-color: #d4edda !important; color: #155724; border: 1px solid #c3e6cb; }
        .wrong-choice   { background-color: #f8d7da !important; color: #721c24; border: 1px solid #f5c6cb; }
        .answered { pointer-events: none; opacity: 0.7; }
        footer { text-align: center; padding: 20px; margin-top: 40px; border-top: 1px solid #e9ecef; color: #6c757d; }
        @media (max-width: 768px) { .literacy-container { flex-direction: column; margin-top: 20px; } }
    </style>
</head>

<body>
    <div th:replace="~{_layout :: main-header}"></div>

    <main class="literacy-container">
        
        <section class="link-section">
            <h2>Mental Health Articles</h2>
            
            <div class="scrollable-content">
                <div th:if="${#lists.isEmpty(articles)}" style="text-align: center; padding: 20px; color: #888;">
                    <p>No resources available.</p>
                </div>
                <div class="article-card" th:each="article : ${articles}">
                    <img th:if="${article.imageUrl != null and !#strings.isEmpty(article.imageUrl)}" 
                         th:src="${article.imageUrl}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 4px; margin-bottom: 10px; display: block;" onerror="this.style.display='none'"/>
                    <a th:href="${article.sourceUrl}" target="_blank">
                        <h3 th:text="${article.title}" style="margin-top: 0; color: #007bff;">Title</h3>
                    </a>
                    <p th:text="${article.description}" style="color: #555; font-size: 0.95rem;">Desc...</p>
                </div>
            </div>
        </section>

        <section class="quiz-section">
            <h2>Daily Quiz</h2>
            
            <div class="scrollable-content">
                <div th:if="${#lists.isEmpty(quizzes)}" style="text-align: center; color: #888;">
                    <p>No quiz available for today!</p>
                </div>

                <div id="quiz-container">
                    <div th:each="quiz, iterStat : ${quizzes}" class="quiz-question" th:id="'question-box-' + ${quiz.id}">
                        <p><strong th:text="${iterStat.count} + '. ' + ${quiz.question}">1. Question Text</strong></p>
                        
                        <div class="radio-option" onclick="checkAnswer(this)" th:data-correct="${quiz.correctAnswer}" th:data-qid="${quiz.id}">
                            <input type="radio" th:name="'q' + ${quiz.id}" th:value="${quiz.correctAnswer}">
                            <label th:text="${quiz.correctAnswer}">Correct Answer</label>
                        </div>
                        
                        <div class="radio-option" onclick="checkAnswer(this)" th:data-correct="${quiz.correctAnswer}" th:data-qid="${quiz.id}">
                            <input type="radio" th:name="'q' + ${quiz.id}" th:value="${quiz.wrongAnswer1}">
                            <label th:text="${quiz.wrongAnswer1}">Wrong 1</label>
                        </div>

                        <div class="radio-option" onclick="checkAnswer(this)" th:data-correct="${quiz.correctAnswer}" th:data-qid="${quiz.id}">
                            <input type="radio" th:name="'q' + ${quiz.id}" th:value="${quiz.wrongAnswer2}">
                            <label th:text="${quiz.wrongAnswer2}">Wrong 2</label>
                        </div>

                        <div class="radio-option" onclick="checkAnswer(this)" th:data-correct="${quiz.correctAnswer}" th:data-qid="${quiz.id}">
                            <input type="radio" th:name="'q' + ${quiz.id}" th:value="${quiz.wrongAnswer3}">
                            <label th:text="${quiz.wrongAnswer3}">Wrong 3</label>
                        </div>
                        <div th:id="'feedback-' + ${quiz.id}" style="margin-top:10px; font-weight:bold; font-size: 0.95rem; display:none;"></div>
                    </div>
                </div>
            </div>
        </section>
        
    </main>

    <script>
        function checkAnswer(element) {
            var correctAnswer = element.getAttribute("data-correct");
            var questionId    = element.getAttribute("data-qid");
            var radio = element.querySelector("input[type='radio']");
            if (!radio) return;
            radio.checked = true;
            var selectedValue = radio.value;
            var feedbackDiv = document.getElementById('feedback-' + questionId);
            var questionBox = document.getElementById('question-box-' + questionId);

            if (selectedValue === correctAnswer) {
                element.classList.add('correct-choice');
                feedbackDiv.style.display = 'block';
                feedbackDiv.style.color = '#155724';
                feedbackDiv.innerHTML = '✅ Correct! Well done.';
            } else {
                element.classList.add('wrong-choice');
                feedbackDiv.style.display = 'block';
                feedbackDiv.style.color = '#721c24';
                feedbackDiv.innerHTML = '❌ Oops! The correct answer was: ' + correctAnswer;
            }

            var allOptions = questionBox.querySelectorAll('.radio-option');
            allOptions.forEach(function(opt) {
                opt.classList.add('answered'); 
                opt.removeAttribute('onclick'); 
            });
        }
    </script>
</body>
</html>
