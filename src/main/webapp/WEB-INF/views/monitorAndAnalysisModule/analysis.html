<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-body text-center">
                        <img src="https://via.placeholder.com/150" class="rounded-circle mb-3" alt="Profile">
                        <h4 th:text="${student.fullName}">Student Name</h4>
                        <p class="text-muted">ID: <span th:text="${student.id}"></span></p>
                        <a href="/monitor" class="btn btn-secondary btn-sm">Back to List</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">Mood vs. Stress Analysis (Last 7 Days)</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="mentalHealthChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // This is the logic for the diagram
        const ctx = document.getElementById('mentalHealthChart').getContext('2d');
        
        new Chart(ctx, {
            type: 'line', // Line chart is best for trends
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [{
                    label: 'Mood Level (Higher is better)',
                    data: [4, 3, 5, 2, 4, 5, 4], // Placeholder numbers
                    borderColor: 'rgb(75, 192, 192)',
                    tension: 0.3,
                    fill: false
                },
                {
                    label: 'Stress Level (Lower is better)',
                    data: [2, 4, 1, 5, 2, 1, 2], // Placeholder numbers
                    borderColor: 'rgb(255, 99, 132)',
                    tension: 0.3,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true, max: 5 }
                }
            }
        });
    </script>
</body>
</html>
