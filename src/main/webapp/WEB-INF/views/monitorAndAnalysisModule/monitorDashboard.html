<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MentalHub - Monitor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link th:href="@{/resources/css/nav-bar.css}" rel="stylesheet" type="text/css"/>

    <style>
        /* Matches the background color from your example */
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; margin: 0; }
        
        /* Card Styles */
        .student-card { background: white; border: 1px solid #eef2f6; transition: all 0.2s; }
        .student-card:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div th:replace="~{_layout :: main-header}"></div>

    <main class="max-w-5xl mx-auto px-4 py-10">
        <h1 class="text-2xl font-bold text-gray-900 mb-8">Student Overview</h1>
        
        <div class="grid grid-cols-1 gap-4">
            <div th:each="u : ${users}" class="student-card rounded-2xl p-6 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <img th:src="${'https://ui-avatars.com/api/?name=' + u.name + '&background=random'}" class="w-12 h-12 rounded-full">
                    <div>
                        <h3 class="font-bold text-gray-900" th:text="${u.name}">Name</h3>
                        <p class="text-xs text-gray-500" th:text="${u.email}">Email</p>
                    </div>
                </div>
                <a th:href="@{/advisor/report(studentId=${u.id})}" class="bg-[#FF8C42] text-white px-6 py-2 rounded-xl font-bold text-sm hover:bg-[#e67e3a] transition-all no-underline">View Report</a>
            </div>
        </div>
    </main>

</body>
</html>
