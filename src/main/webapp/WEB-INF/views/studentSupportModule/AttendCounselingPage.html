<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Attend Counseling - MentalHub</title>
        <link th:href="@{/resources/css/nav-bar.css}" rel="stylesheet" type="text/css"/>
        <style>
            .container {
                max-width: 800px;
                margin: 20px auto;
                padding: 20px;
                background-color: #f9f9f9;
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(0,0,0,0.1);
            }
            h1 {
                color: #333;
                text-align: center;
            }
            .session-list {
                list-style: none;
                padding: 0;
            }
            .session-item {
                background-color: white;
                margin: 10px 0;
                padding: 15px;
                border-radius: 6px;
                border-left: 5px solid #4A90E2;
            }
            .session-title {
                font-weight: bold;
                color: #333;
            }
            .session-details {
                color: #666;
                margin-top: 5px;
            }
            .join-btn {
                background-color: #4A90E2;
                color: white;
                border: none;
                padding: 8px 16px;
                border-radius: 4px;
                cursor: pointer;
                margin-top: 10px;
            }
            .join-btn:hover {
                background-color: #357ABD;
            }
        </style>
    </head>
    <body>
        <div th:insert="~{_layout :: main-header}"></div>

        <div class="container">

            <h2>Join one of our wonderful Counseling Sessions</h2>

            <ul>
                <li th:each="s : ${sessions}">
                    <p>ID: <span th:text="${s.id}">id</span></p>
                    <p>Name: <span th:text="${s.name}">name</span></p>
                    <p>Date: <span th:text="${s.date}">date</span></p>
                    <p>Time: <span th:text="${s.time}">time</span></p>
                    <p>Advisor: <span th:text="${s.advisor}">advisor</span></p>
                    <hr>
                </li>
            </ul>

        </div>
    </body>
</html>
